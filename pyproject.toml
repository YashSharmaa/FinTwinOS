[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintwinos"
version = "0.1.0"
description = "FinTwinOS — an auditable digital-twin operating system for financial organisations: typed LLM tools, agent swarms, calibrated simulators, and bounded RL behind governance gates."
readme = "README.md"
authors = [{ name = "Yash Sharma" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "digital-twin", "finance", "llm", "agents", "multi-agent",
  "risk", "compliance", "treasury", "reinforcement-learning", "governance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "networkx>=3.2",
  "httpx>=0.27",
  "openai>=1.40",
  "jsonschema>=4.21",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "pip-audit>=2.7",
]

[project.urls]
Author = "https://www.linkedin.com/in/yashsharmaa/"

[project.scripts]
fintwinos = "fintwinos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fintwinos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
