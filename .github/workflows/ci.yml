# FinTwinOS continuous integration: lint + offline test matrix.
#
# Everything runs with FINTWIN_OFFLINE=1 — no OpenAI key, no network access —
# so CI exercises exactly the deterministic, rule-based paths the platform
# guarantees for air-gapped deployments.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FINTWIN_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev and server extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (offline, deterministic)
        run: pytest -q
