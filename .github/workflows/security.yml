# Dependency vulnerability scanning with pip-audit.
#
# Runs on every pull request and weekly against main. The job is advisory
# (continue-on-error) so a freshly published CVE in a transitive dependency
# never blocks unrelated work — findings surface in the job log and summary.

name: Security

on:
  pull_request:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with server extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server]" pip-audit

      - name: Audit installed dependencies
        run: pip-audit --skip-editable
