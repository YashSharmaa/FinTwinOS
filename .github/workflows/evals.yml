# FinTwinOS evaluation harness: function-call accuracy, agent runs and domain
# metrics, executed fully offline (FINTWIN_OFFLINE=1) so results are
# deterministic and reproducible with zero secrets.
#
# Trigger manually from the Actions tab, or rely on the weekly schedule to
# catch regressions on main. Reports are uploaded as build artifacts.

name: Evals

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Eval suite to run ('all' or a single suite name)"
        required: false
        default: "all"
        type: string
  schedule:
    # Mondays 07:00 UTC
    - cron: "0 7 * * 1"

permissions:
  contents: read

env:
  FINTWIN_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  evals:
    name: offline evals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev and server extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Run evaluation suites (offline, deterministic)
        run: |
          fintwinos eval "${{ github.event.inputs.suite || 'all' }}" \
            --report .fintwinos/eval-report

      - name: Upload eval report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: .fintwinos/eval-report*
          if-no-files-found: warn
          retention-days: 90
